<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedro Henrique Lopes · Frontend Engineer</title>
    <meta
      name="description"
      content="Frontend Engineer com mais de 4 anos em produção com React, Next.js e TypeScript: design systems acessíveis, performance web e IA integrada a fluxos reais."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f7f8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" type="text/plain" title="Perfil para agentes de IA" href="/llms.txt" />
    <link rel="alternate" type="application/json" title="Perfil estruturado" href="/ai.json" />
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Pedro Henrique Lopes · Frontend Engineer" />
    <meta
      property="og:description"
      content="React, Next.js e TypeScript em produção: design systems acessíveis, performance web e IA integrada a fluxos reais."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        let dark = matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          const stored = localStorage.getItem('theme');
          if (stored) dark = stored === 'dark';
        } catch {}
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#17181b' : '#f7f7f8';
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main id="conteudo">
        <section id="inicio" class="mx-auto max-w-6xl px-5 pb-20 pt-10 sm:px-8 sm:pt-14">
          <h1
            id="inicio-titulo"
            class="display-wide mt-6 text-[clamp(2.6rem,7.4vw,4.6rem)] uppercase leading-[0.9]"
          >
            <span class="block">Pedro</span>
            <span class="block">Henrique</span>
            <span class="block">Lopes</span>
          </h1>
          <p class="mt-7 max-w-xl text-[clamp(1.25rem,2.1vw,1.55rem)] font-semibold leading-snug">
            Transformo fluxos complexos em interfaces rápidas, acessíveis e fáceis de manter.
          </p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
